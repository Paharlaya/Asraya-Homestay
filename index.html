<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asraya Homestay</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #faf7f2;
    color: #2c2a26;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #17150f; color: #ece7dd; }
  }
  main { text-align: center; padding: 2rem; }
  img { width: 120px; height: auto; margin-bottom: 1.5rem; }
  h1 { font-size: 2rem; font-weight: 600; margin: 0 0 .5rem; letter-spacing: -.01em; }
  p { margin: 0; opacity: .7; }
  code { font-size: .85em; opacity: .55; display: block; margin-top: 2rem; }
</style>
</head>
<body>
<main>
  <img src="./logo.svg" alt="Asraya Homestay logo">
  <h1>Asraya Homestay</h1>
  <p>Site coming soon.</p>
  <code>GitHub Pages deploy test</code>
</main>
</body>
</html>
